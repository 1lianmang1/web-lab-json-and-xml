<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book XML Showing</title>
    <style>
        .book-item{ border:1px solid #ccc; padding:10px; margin:8px 0; }
    </style>
</head>
<body>
    <h1>Book Catalogue</h1>
    <div id="bookContainer"></div>
    <script>
        const container = document.getElementById("bookContainer");
        fetch('book.xml')
        .then(response=>{
            if(!response.ok){
                throw new Error("Failed to fetch xml "+response.status);
            }
            return response.text();
        })
        .then(xmlText=>{
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText,'text/xml');
            const bookList = xmlDoc.getElementsByTagName("book");
            for(let i=0; i<bookList.length; i++){
                const oneBook = bookList[i];
                const bookId = oneBook.getAttribute("id");
                const title = oneBook.querySelector("title").textContent;
                const author = oneBook.querySelector("author").textContent;
                const price = oneBook.querySelector("price").textContent;
                const htmlStr = `
                    <div class="book-item">
                        <p>Book ID: ${bookId}</p>
                        <p>Title: ${title}</p>
                        <p>Author: ${author}</p>
                        <p>Price: ${price}</p>
                    </div>
                `;
                container.innerHTML += htmlStr;
            }
        })
        .catch(err=>{
            console.error(err);
            container.innerText = "Load Error: "+err.message;
        })
    </script>
</body>
</html>
