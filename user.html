<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF‑8">
    <title>User Profiles</title>
    <style>
        .user-card{
            border:1px solid #666;
            padding:12px;
            margin:10px 0;
        }
    </style>
</head>
<body>
    <h1>User Profile List</h1>
    <div id="userBox"></div>

    <script>
        const userBox = document.getElementById("userBox");

        fetch('userProfiles.json')
        .then(response => {
            if (!response.ok)
                throw new Error('Fetch error: ' + response.status)
            else
                return response.json();
        })
        .then(jsonData => {
            jsonData.forEach(user=>{
                const {
                    firstName, lastName, email, dateOfBirth,
                    address, preferences
                } = user;

                const {street,city,state,zipCode} = address;
                const {theme, language, notifications, subscription} = preferences;

                const html = `
                <div class="user-card">
                    <h3>${firstName} ${lastName}</h3>
                    <p>Email: ${email}</p>
                    <p>Date Of Birth: ${dateOfBirth}</p>
                    <p>Address: ${street}, ${city}, ${state}, ${zipCode}</p>
                    <p>Theme: ${theme}</p>
                    <p>Language: ${language}</p>
                    <p>Notifications Enabled: ${notifications?"Yes":"No"}</p>
                    <p>Newsletter Subscription: ${subscription?"Subscribed":"Not Subscribed"}</p>
                </div>
                `;
                userBox.innerHTML += html;
            })
        })
        .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
