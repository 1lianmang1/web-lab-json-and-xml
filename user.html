<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <title>用户档案JSON展示</title>
    <style>
        .user-card{
            border:1px solid #666;
            padding:12px;
            margin:10px 0;
        }
    </style>
</head>
<body>
    <h1>用户档案列表</h1>
    <div id="userBox"></div>

    <script>
        const userBox = document.getElementById("userBox");

  
        fetch('userProfiles.json')
        .then(response => {
            if (!response.ok)
                throw new Error('Fetch error: ' + response.status)
            else

                return response.json();
        })
        .then(jsonData => {

            jsonData.forEach(user=>{

                const {
                    firstName, lastName, email, dateOfBirth,
                    address, preferences
                } = user;


                const {street,city,state,zipCode} = address;

                const {theme, language, notifications, subscription} = preferences;


                const html = `
                <div class="user-card">
                    <h3>${firstName} ${lastName}</h3>
                    <p>邮箱：${email}</p>
                    <p>出生日期：${dateOfBirth}</p>
                    <p>地址：${street}, ${city}, ${state}, ${zipCode}</p>
                    <p>主题：${theme}</p>
                    <p>语言：${language}</p>
                    <p>开启通知：${notifications?"是":"否"}</p>
                    <p>订阅简报：${subscription?"已订阅":"未订阅"}</p>
                </div>
                `;
                userBox.innerHTML += html;
            })
        })
        .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
